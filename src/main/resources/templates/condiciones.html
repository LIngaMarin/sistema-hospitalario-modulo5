<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Condiciones medicas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Condiciones medicas</h2>
    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form action="/condiciones/guardar" method="post" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre de la condicion" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Registrar</button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Condicion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${condiciones}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
