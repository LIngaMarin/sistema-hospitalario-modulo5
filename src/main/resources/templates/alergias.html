<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alergias</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Alergias</h2>
    <p>RF-HC-07: registro de alergias del paciente.</p>

    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/alergias/nuevo" class="btn btn-primary mb-3">Nueva alergia</a>
    <a href="/antecedentes" class="btn btn-secondary mb-3">Ver antecedentes personales</a>
    <a href="/antecedentes-familiares" class="btn btn-secondary mb-3">Ver antecedentes familiares</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Historia clinica</th>
            <th>Alergia</th>
            <th>Tipo</th>
            <th>Reaccion</th>
            <th>Fecha de registro</th>
            <th>Observaciones</th>
            <th>Accion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${alergias}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.historiaClinica?.numeroHistoria}"></td>
            <td th:text="${a.nombre}"></td>
            <td th:text="${a.tipo}"></td>
            <td th:text="${a.reaccion}"></td>
            <td th:text="${a.fechaRegistro}"></td>
            <td th:text="${a.observaciones}"></td>
            <td>
                <a th:href="@{/alergias/editar/{id}(id=${a.id})}"
                   class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{/alergias/eliminar/{id}(id=${a.id})}"
                   class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
