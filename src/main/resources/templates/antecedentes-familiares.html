<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antecedentes familiares</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Antecedentes familiares</h2>
    <p>RF-HC-06: registro de antecedentes familiares del paciente.</p>

    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/antecedentes-familiares/nuevo" class="btn btn-primary mb-3">Nuevo antecedente familiar</a>
    <a href="/antecedentes" class="btn btn-secondary mb-3">Ver antecedentes personales</a>
    <a href="/alergias" class="btn btn-secondary mb-3">Ver alergias</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Historia clinica</th>
            <th>Enfermedad</th>
            <th>Parentesco</th>
            <th>Fecha de registro</th>
            <th>Observaciones</th>
            <th>Accion</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${antecedentes}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.historiaClinica?.numeroHistoria}"></td>
            <td th:text="${a.enfermedad}"></td>
            <td th:text="${a.parentesco}"></td>
            <td th:text="${a.fechaRegistro}"></td>
            <td th:text="${a.observaciones}"></td>
            <td>
                <a th:href="@{/antecedentes-familiares/editar/{id}(id=${a.id})}"
                   class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{/antecedentes-familiares/eliminar/{id}(id=${a.id})}"
                   class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
