<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Roles</h2>
    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/roles/nuevo" class="btn btn-primary mb-3">Nuevo rol</a>
    <a href="/usuarios" class="btn btn-secondary mb-3">Usuarios</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${roles}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.nombre}"></td>
            <td th:text="${r.descripcion}"></td>
            <td>
                <span th:if="${r.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${r.activo}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <a th:href="@{/roles/editar/{id}(id=${r.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/roles/estado/{id}(id=${r.id})}" method="post" class="d-inline">
                    <button type="submit" th:if="${r.activo}" class="btn btn-outline-danger btn-sm">Desactivar</button>
                    <button type="submit" th:unless="${r.activo}" class="btn btn-outline-success btn-sm">Activar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
