<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuario</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${usuario.id == null} ? @{/usuarios/guardar} : @{/usuarios/actualizar/{id}(id=${usuario.id})}"
          method="post" th:object="${usuario}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" th:field="*{username}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" class="form-control" name="password"
                   th:required="${usuario.id == null}">
            <div class="form-text" th:if="${usuario.id != null}">Dejar vacio para conservar la contrasena actual.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>

        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" name="rol.id" required>
                <option value="">-- Seleccione un rol --</option>
                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"
                        th:selected="${usuario.rol != null and usuario.rol.id == r.id}"></option>
            </select>
        </div>

        <div class="form-check mb-3" th:if="${usuario.id != null}">
            <input class="form-check-input" type="checkbox" id="activo" th:checked="${usuario.activo}" disabled>
            <label class="form-check-label" for="activo">Activo (se cambia con el boton Activar/Desactivar de la lista)</label>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
    </form>

</div>
</body>
</html>
