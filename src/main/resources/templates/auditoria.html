<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bitacora de auditoria</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Bitacora de auditoria</h2>
    <p>Operaciones registradas automaticamente sobre las entidades del sistema.</p>

    <a href="/panel" class="btn btn-secondary mb-3">Volver al panel</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Fecha y hora</th>
            <th>Operacion</th>
            <th>Entidad</th>
            <th>ID del registro</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${registros}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.usuario}"></td>
            <td th:text="${#temporals.format(r.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td>
                <span class="badge"
                      th:classappend="${r.operacion == 'REGISTRO'} ? 'bg-success' : (${r.operacion == 'MODIFICACION'} ? 'bg-warning text-dark' : 'bg-danger')"
                      th:text="${r.operacion}"></span>
            </td>
            <td th:text="${r.entidad}"></td>
            <td th:text="${r.idRegistro}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
