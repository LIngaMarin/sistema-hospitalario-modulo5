<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2>Usuarios</h2>
    <a href="/panel" class="btn btn-outline-secondary mb-3">Inicio</a>
    <a href="/usuarios/nuevo" class="btn btn-primary mb-3">Nuevo usuario</a>
    <a href="/roles" class="btn btn-secondary mb-3">Roles</a>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Nombre completo</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.nombreCompleto}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol.nombre}"></td>
            <td>
                <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/usuarios/estado/{id}(id=${u.id})}" method="post" class="d-inline">
                    <button type="submit" th:if="${u.activo}" class="btn btn-outline-danger btn-sm">Desactivar</button>
                    <button type="submit" th:unless="${u.activo}" class="btn btn-outline-success btn-sm">Activar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
