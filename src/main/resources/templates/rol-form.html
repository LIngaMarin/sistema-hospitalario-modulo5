<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rol</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${rol.id == null} ? 'Nuevo rol' : 'Editar rol'">Rol</h2>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${rol.id == null} ? @{/roles/guardar} : @{/roles/actualizar/{id}(id=${rol.id})}"
          method="post" th:object="${rol}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <input type="text" class="form-control" th:field="*{descripcion}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/roles" class="btn btn-secondary">Cancelar</a>
    </form>

</div>
</body>
</html>
