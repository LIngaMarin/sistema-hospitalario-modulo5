<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antecedente personal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${antecedente.id == null} ? 'Nuevo antecedente personal' : 'Editar antecedente personal'">Nuevo antecedente personal</h2>

    <form action="/antecedentes/guardar" method="post" th:object="${antecedente}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">ID de la historia clinica</label>
            <input type="number" class="form-control" th:field="*{historiaClinica.id}">
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select class="form-select" th:field="*{categoria}">
                <option value="Enfermedad previa">Enfermedad previa</option>
                <option value="Cirugia">Cirugia</option>
                <option value="Hospitalizacion">Hospitalizacion</option>
                <option value="Enfermedad cronica">Enfermedad cronica</option>
                <option value="Traumatismo">Traumatismo</option>
                <option value="Transfusion">Transfusion</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <input type="text" class="form-control" th:field="*{descripcion}">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de registro</label>
            <input type="text" class="form-control" th:field="*{fechaRegistro}"
                   placeholder="11/09/2026">
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <input type="text" class="form-control" th:field="*{observaciones}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/antecedentes" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
