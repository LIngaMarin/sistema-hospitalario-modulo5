<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antecedente familiar</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${antecedente.id == null} ? 'Nuevo antecedente familiar' : 'Editar antecedente familiar'">Nuevo antecedente familiar</h2>

    <form action="/antecedentes-familiares/guardar" method="post" th:object="${antecedente}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">ID de la historia clinica</label>
            <input type="number" class="form-control" th:field="*{historiaClinica.id}">
        </div>

        <div class="mb-3">
            <label class="form-label">Enfermedad</label>
            <select class="form-select" th:field="*{enfermedad}">
                <option value="Diabetes">Diabetes</option>
                <option value="Hipertension">Hipertension</option>
                <option value="Enfermedad cardiovascular">Enfermedad cardiovascular</option>
                <option value="Cancer">Cancer</option>
                <option value="Enfermedad hereditaria">Enfermedad hereditaria</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Parentesco</label>
            <select class="form-select" th:field="*{parentesco}">
                <option value="Padre">Padre</option>
                <option value="Madre">Madre</option>
                <option value="Hermano">Hermano</option>
                <option value="Hermana">Hermana</option>
                <option value="Abuelo">Abuelo</option>
                <option value="Abuela">Abuela</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de registro</label>
            <input type="text" class="form-control" th:field="*{fechaRegistro}"
                   placeholder="11/09/2026">
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <input type="text" class="form-control" th:field="*{observaciones}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/antecedentes-familiares" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
