<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alergia</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">

    <h2 th:text="${alergia.id == null} ? 'Nueva alergia' : 'Editar alergia'">Nueva alergia</h2>

    <form action="/alergias/guardar" method="post" th:object="${alergia}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">ID de la historia clinica</label>
            <input type="number" class="form-control" th:field="*{historiaClinica.id}">
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre de la alergia</label>
            <input type="text" class="form-control" th:field="*{nombre}"
                   placeholder="Penicilina">
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select class="form-select" th:field="*{tipo}">
                <option value="Medicamento">Medicamento</option>
                <option value="Alimento">Alimento</option>
                <option value="Ambiental">Ambiental</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Reaccion</label>
            <input type="text" class="form-control" th:field="*{reaccion}"
                   placeholder="Erupcion cutanea">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de registro</label>
            <input type="text" class="form-control" th:field="*{fechaRegistro}"
                   placeholder="11/09/2026">
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <input type="text" class="form-control" th:field="*{observaciones}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/alergias" class="btn btn-secondary">Cancelar</a>

    </form>

</div>
</body>
</html>
